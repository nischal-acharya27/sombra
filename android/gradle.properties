# Committed, non-secret build settings. Signing and the real AdMob ids are
# NOT here — they go in ~/.gradle/gradle.properties (outside the repo), see
# android/README.md.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Play package name. Permanent once the first build is uploaded.
sombra.applicationId=io.github.nischalacharya27.sombra
sombra.versionCode=1
sombra.versionName=0.12.0
