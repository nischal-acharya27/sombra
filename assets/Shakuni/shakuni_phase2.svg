<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="phase2Core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="1"/>
      <stop offset="50%" stop-color="#990000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Demonic Aura Overlay -->
  <rect width="500" height="500" fill="#0c070a"/>
  <circle cx="250" cy="250" r="230" fill="url(#phase2Core)"/>

  <!-- Veins of Crimson Energy -->
  <g stroke="#ff3333" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 250 50 Q 200 150 250 250 T 250 450"/>
    <path d="M 50 250 Q 150 200 250 250 T 450 250"/>
    <path d="M 100 100 L 400 400 M 400 100 L 100 400" stroke-dasharray="10 5"/>
  </g>

  <!-- Glowing Eye Runes for Phase 2 Face Material -->
  <g fill="#ff0033">
    <circle cx="200" cy="200" r="15"/>
    <circle cx="300" cy="200" r="15"/>
    <polygon points="250,220 230,280 270,280" opacity="0.6"/>
  </g>
</svg>
