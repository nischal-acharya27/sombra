<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
  <defs>
    <style>
      .face { fill: #1c1815; stroke: #c5a059; stroke-width: 4; }
      .pip-gold { fill: #c5a059; }
      .pip-red { fill: #dc143c; }
    </style>
  </defs>

  <!-- Side 1 (Center Eye - Loaded Die) -->
  <g transform="translate(0, 0)">
    <rect x="5" y="5" width="90" height="90" rx="8" class="face"/>
    <circle cx="50" cy="50" r="12" class="pip-red"/>
    <!-- Sinister Pupil -->
    <polygon points="50,40 54,50 50,60 46,50" fill="#000"/>
  </g>

  <!-- Side 2 -->
  <g transform="translate(100, 0)">
    <rect x="5" y="5" width="90" height="90" rx="8" class="face"/>
    <circle cx="28" cy="28" r="8" class="pip-gold"/>
    <circle cx="72" cy="72" r="8" class="pip-gold"/>
  </g>

  <!-- Side 3 -->
  <g transform="translate(200, 0)">
    <rect x="5" y="5" width="90" height="90" rx="8" class="face"/>
    <circle cx="25" cy="25" r="7" class="pip-gold"/>
    <circle cx="50" cy="50" r="7" class="pip-red"/>
    <circle cx="75" cy="75" r="7" class="pip-gold"/>
  </g>

  <!-- Side 4 -->
  <g transform="translate(0, 100)">
    <rect x="5" y="5" width="90" height="90" rx="8" class="face"/>
    <circle cx="28" cy="28" r="7" class="pip-gold"/>
    <circle cx="72" cy="28" r="7" class="pip-gold"/>
    <circle cx="28" cy="72" r="7" class="pip-gold"/>
    <circle cx="72" cy="72" r="7" class="pip-gold"/>
  </g>

  <!-- Side 5 -->
  <g transform="translate(100, 100)">
    <rect x="5" y="5" width="90" height="90" rx="8" class="face"/>
    <circle cx="25" cy="25" r="7" class="pip-gold"/>
    <circle cx="75" cy="28" r="7" class="pip-gold"/>
    <circle cx="50" cy="50" r="8" class="pip-red"/>
    <circle cx="25" cy="75" r="7" class="pip-gold"/>
    <circle cx="75" cy="75" r="7" class="pip-gold"/>
  </g>

  <!-- Side 6 -->
  <g transform="translate(200, 100)">
    <rect x="5" y="5" width="90" height="90" rx="8" class="face"/>
    <circle cx="28" cy="22" r="7" class="pip-gold"/>
    <circle cx="28" cy="50" r="7" class="pip-gold"/>
    <circle cx="28" cy="78" r="7" class="pip-gold"/>
    <circle cx="72" cy="22" r="7" class="pip-gold"/>
    <circle cx="72" cy="50" r="7" class="pip-gold"/>
    <circle cx="72" cy="78" r="7" class="pip-gold"/>
  </g>
</svg>
