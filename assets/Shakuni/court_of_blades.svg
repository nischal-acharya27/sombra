<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 400" width="250" height="400">
  <!-- Card Background -->
  <rect x="5" y="5" width="240" height="390" rx="15" fill="#120e14" stroke="#c5a059" stroke-width="4"/>
  <rect x="15" y="15" width="220" height="370" rx="10" fill="none" stroke="#8b0000" stroke-width="2"/>
  
  <!-- Corner Embellishments -->
  <path d="M 20 40 L 40 20 M 230 40 L 210 20 M 20 360 L 40 380 M 230 360 L 210 380" stroke="#c5a059" stroke-width="2"/>
  
  <!-- Central Emblem (Sinister Crimson/Gold Geometric Symbol) -->
  <g transform="translate(125, 200)">
    <!-- Outer Gold Ring -->
    <circle r="65" fill="none" stroke="#c5a059" stroke-width="3"/>
    <circle r="55" fill="none" stroke="#8b0000" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- Central Loaded Die Symbol / Diamond -->
    <polygon points="0,-45 45,0 0,45 -45,0" fill="#2d0a0a" stroke="#dc143c" stroke-width="3"/>
    
    <!-- Dice Pips / Magical Marks -->
    <circle cx="0" cy="0" r="8" fill="#ff2200"/>
    <circle cx="-20" cy="-20" r="5" fill="#c5a059"/>
    <circle cx="20" cy="20" r="5" fill="#c5a059"/>
    <circle cx="-20" cy="20" r="5" fill="#c5a059"/>
    <circle cx="20" cy="-20" r="5" fill="#c5a059"/>
  </g>
  
  <!-- Filigree Border Accents -->
  <path d="M 125 25 L 135 45 L 115 45 Z" fill="#c5a059"/>
  <path d="M 125 375 L 135 355 L 115 355 Z" fill="#c5a059"/>
</svg>
