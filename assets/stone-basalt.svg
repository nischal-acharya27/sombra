<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Basalt grain for gate 11's fortress. A MULTIPLY map: near-white base so
       it modulates the material's own colour rather than replacing it, with
       darker fracture lines and speckle for the columnar-basalt read.
       Detail is kept clear of the tile border so the repeat seam stays quiet. -->
  <rect width="256" height="256" fill="#f2f0ee"/>
  <g stroke="#b9b2ab" fill="none" stroke-linecap="round">
    <path d="M40 18 L52 74 L34 128 L58 186 L44 240" stroke-width="3.5"/>
    <path d="M126 12 L112 68 L134 122 L118 178 L138 246" stroke-width="3"/>
    <path d="M208 20 L196 80 L216 134 L200 190 L212 242" stroke-width="3.5"/>
    <path d="M52 74 L112 68" stroke-width="2.5"/>
    <path d="M34 128 L134 122 L216 134" stroke-width="2.5"/>
    <path d="M58 186 L118 178 L200 190" stroke-width="2.5"/>
  </g>
  <g fill="#cdc6bf">
    <circle cx="72" cy="46" r="3.5"/><circle cx="158" cy="38" r="2.5"/>
    <circle cx="96" cy="102" r="3"/><circle cx="182" cy="96" r="4"/>
    <circle cx="66" cy="158" r="2.5"/><circle cx="150" cy="150" r="3.5"/>
    <circle cx="228" cy="164" r="3"/><circle cx="88" cy="214" r="3.5"/>
    <circle cx="172" cy="220" r="2.5"/><circle cx="24" cy="96" r="2.5"/>
  </g>
  <g fill="#dcd6d0">
    <rect x="60" y="120" width="26" height="9" rx="4"/>
    <rect x="150" y="60" width="30" height="8" rx="4"/>
    <rect x="100" y="196" width="24" height="9" rx="4"/>
    <rect x="190" y="112" width="22" height="8" rx="4"/>
  </g>
</svg>
